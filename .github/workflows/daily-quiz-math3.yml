name: Daily Math III Quiz

on:
  schedule:
    # 22:10 UTC = 07:10 JST（配信時刻を変えたい場合はここを編集）
    - cron: "10 22 * * *"
  workflow_dispatch: {}

# 履歴ファイルの更新（push）が数学I〜Cの配信と重ならないよう、順番に実行する
concurrency:
  group: quiz-history
  cancel-in-progress: false

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send today's questions
        env:
          POWER_AUTOMATE_URL_MATH3: ${{ secrets.POWER_AUTOMATE_URL_MATH3 }}
        run: |
          if [ -z "$POWER_AUTOMATE_URL_MATH3" ]; then
            echo "::notice::POWER_AUTOMATE_URL_MATH3 が未設定のため、配信をスキップします"
            exit 0
          fi
          python scripts/send_math3.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add questions/history_math3.json
          git diff --cached --quiet || git commit -m "chore: update math3 quiz history"
          git pull --rebase origin main
          git push
