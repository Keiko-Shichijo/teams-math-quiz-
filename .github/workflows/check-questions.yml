name: Check Questions

on:
  push:
    paths:
      - "questions/**"
      - "scripts/**"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Validate question data
        run: python scripts/send_question.py --check

      - name: Dry run (no post, history unchanged)
        run: python scripts/send_question.py --dry-run
